name: Debug - inspect league standings shape (throwaway)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump raw H2H standings JSON
        run: |
          curl -sS "https://fantasy.premierleague.com/api/leagues-h2h/980155/standings/?page_new_entries=1&page_standings=1" | python3 -m json.tool
