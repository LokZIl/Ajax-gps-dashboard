name: Refresh FPL fines data

on:
  schedule:
    # Daily at 06:00 UTC — well after FPL usually finalizes the previous day's results.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: DEBUG dump raw H2H standings JSON
        run: |
          curl -sS "https://fantasy.premierleague.com/api/leagues-h2h/980155/standings/?page_new_entries=1&page_standings=1" | python3 -m json.tool
